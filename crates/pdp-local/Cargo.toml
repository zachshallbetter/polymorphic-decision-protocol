[package]
name = "pdp-local"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
pdp-core = { path = "../pdp-core" }
rand = "0.9"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
security-framework = "3.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "pdp-local"
path = "src/main.rs"
